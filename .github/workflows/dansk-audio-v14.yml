name: Generate Danish audio V14
on:
  push:
    branches:
      - main
      - feature/a1-c1-vokabeln-audio-v14
    paths:
      - index.html
      - tools/generate_audio.py
      - .github/workflows/dansk-audio-v14.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Danish offline voice and MP3 encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg
      - name: Generate all matching speech files
        run: python3 tools/generate_audio.py
      - name: Save generated MP3s on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "audio: add Danish MP3 clips for lessons A1-C2"
            git push
          fi
