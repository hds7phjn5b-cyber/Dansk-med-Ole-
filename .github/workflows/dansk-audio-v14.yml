name: Generate Danish audio (Christel)
on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - index.html
      - tools/generate_audio.py
      - .github/workflows/dansk-audio-v14.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: danish-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural Danish speech synthesizer
        run: python -m pip install --upgrade edge-tts
      - name: Generate all Danish speech clips with Christel
        run: python tools/generate_audio.py
      - name: Verify audio coverage and voice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items = json.loads(Path('audio-manifest.json').read_text(encoding='utf-8'))
          assert len(items) == 308, f"Expected 308 MP3s, got {len(items)}"
          assert len({x['path'] for x in items}) == len(items)
          for item in items:
              assert item['voice'] == 'da-DK-ChristelNeural'
              assert Path(item['path']).stat().st_size > 1000
          print('Validated 308 Danish female-voice MP3 clips.')
          PY
      - name: Commit regenerated MP3s
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/ audio-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "audio: replace robotic eSpeak files with Christel Neural"
            git push
          fi
